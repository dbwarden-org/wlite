name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish-c:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build artifacts
        run: make libwlite.a
      - name: Package Linux
        run: |
          mkdir -p pkg/include/wlite pkg/lib
          cp include/wlite/wlite.h pkg/include/wlite/
          cp libwlite.a pkg/lib/
          tar czf wlite-${{ github.ref_name }}-linux-x86_64.tar.gz -C pkg .
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: wlite-*.tar.gz

  publish-rust:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build libwlite
        run: make libwlite.a
      - name: Publish to crates.io
        run: cargo publish --allow-dirty
        working-directory: bindings/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

  publish-python:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Build libwlite
        run: make libwlite.a
      - name: Build wheel
        run: |
          pip install build
          python -m build
        working-directory: bindings/python
      - name: Publish to PyPI
        run: |
          pip install twine
          twine upload dist/*
        working-directory: bindings/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  publish-go:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag Go module
        run: |
          cd bindings/go
          go mod tidy
          git tag go/v${{ github.ref_name }}
          git push origin go/v${{ github.ref_name }}
