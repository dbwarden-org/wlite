[project]
site_name = "wlite Documentation"
site_description = "wlite: dbwarden's SQLite3 engine as a CLI with language bindings for C++, Rust, Python, Go, C#, and Zig. Declarative schema management, migrations, and queries."
site_url = "https://wlite.dbwarden.org"
docs_dir = "docs"
site_dir = "site"

copyright = "&copy; 2026 Emiliano Gandini Outeda"

extra_css = ["stylesheets/extra.css"]

[project.theme]
variant = "modern"
custom_dir = "docs/overrides"

font.text = "Ubuntu"
font.code = "JetBrains Mono"

features = [
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.tabs",
    "navigation.indexes",
    "navigation.top",
    "navigation.footer",
    "search.suggest",
    "search.highlight",
    "content.code.copy",
    "content.code.annotate",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/dbwarden-org/wlite"
name = "wlite on GitHub"

[[project.nav]]
Overview = [
  {Overview = "index.md"},
  {Philosophy = "philosophy.md"},
  {"Relationship to dbwarden" = "relationship-to-dbwaden.md"},
  {"Grammar" = "grammar.md"},
  {"Workflow" = "workflow.md"},
]

[[project.nav]]
Architecture = [
  {Overview = "architecture/index.md"},
  {"Data Flow" = "architecture/data-flow.md"},
  {"Migration Internals" = "architecture/migration-internals.md"},
  {"SQLite Patterns" = "architecture/sqlite-patterns.md"},
  {"Memory and Errors" = "architecture/memory-and-errors.md"},
]

[[project.nav]]
"API Reference" = [
  {"C API" = "c-api.md"},
]

[[project.nav]]
Bindings = [
  {C = "bindings/c/index.md"},
  {Rust = "bindings/rust/index.md"},
  {Python = "bindings/python/index.md"},
  {Cpp = "bindings/cpp/index.md"},
  {Go = "bindings/go/index.md"},
  {"C#" = "bindings/csharp/index.md"},
  {Zig = "bindings/zig/index.md"},
]

[project.markdown_extensions]
"seoslug.contrib.zensical" = {
  canonical_host = "dbwarden.org",
  public_base_url = "https://wlite.dbwarden.org/",
  site_name = "wlite Documentation",
  title_template = "{title} - wlite",
  publisher_name = "Emiliano Gandini Outeda",
  locale = "en_US",
  auto_generate_schema = true,
}

[project.markdown_extensions.tables]
[project.markdown_extensions.admonition]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
